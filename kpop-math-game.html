   YOUTUBE IFRAME API — detect when music actually starts playing
════════════════════════════════════════════════════════════════ */

// Load the YouTube IFrame API script once
(function loadYTAPI() {
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();

// Called by YouTube API when ready
function onYouTubeIframeAPIReady() {
  ytReady = true;
}

// Called when YT player state changes
function onYTStateChange(event) {
  // 1 = PLAYING
  if (event.data === 1 && pendingChars) {
    startSingingAfterDelay(pendingChars.chars, pendingChars.lyricsDelay);
    pendingChars = null;
  }
}

// Singing phase intervals — store so we can clear them
let singIntervals = [];

// Start singing video after lyricsDelay from when music ACTUALLY starts.
// Alternates: sing for ~4.5s → dance for ~3s → sing → dance ...
// This creates musical "phrases" that feel connected to the song.
function startSingingAfterDelay(chars, lyricsDelay) {
  if (singTimeout) clearTimeout(singTimeout);
  singIntervals.forEach(id => clearTimeout(id));
  singIntervals = [];

  singTimeout = setTimeout(() => {
    singTimeout = null;
    // Start first phrase immediately, then alternate
    startSingPhrase(chars);
  }, lyricsDelay * 1000);
}

function startSingPhrase(chars) {
  const track = YT_TRACKS[currentLevel - 1];
  const bpm = track ? (track.bpm || 120) : 120;
  const halfBeatMs = (60 / bpm / 2) * 1000;   // half-beat in ms

  chars.forEach((src, charIdx) => {
    const wrap = document.querySelector('.singer-wrap:nth-child(' + (charIdx + 1) + ')');
    if (!wrap) return;

    // Skip frame-swapping if using video — video handles its own animation
    if (wrap.dataset.hasVideo === 'true') {
      wrap.classList.add('singing-active');
      return;
    }

    const frames = SING_FRAMES[src] || [];
    if (frames.length === 0) return;

    const img = wrap.querySelector('img.singer-video');
    if (!img) return;

    // Pre-load all singing frames so swaps are instant
    frames.forEach(f => { const i = new Image(); i.src = f + IMG_V; });
    if (REST_ALT[src]) { const i = new Image(); i.src = REST_ALT[src] + IMG_V; }

    let tick = 0;
    const beatDur = (60 / bpm).toFixed(3);

    // On every half-beat: alternate mouth-open / mouth-closed
    const intervalId = setInterval(() => {
      tick++;
      if (tick % 2 === 1) {
        // On-beat: random singing pose (mouth open)
        const frame = frames[Math.floor(Math.random() * frames.length)];
        img.src = frame + IMG_V;
        img.className = 'singer-video singing-frame';
        img.style.setProperty('--beat', beatDur + 's');
      } else {
        // Off-beat: rest pose (mouth closed) — occasionally use alt rest
        const useAlt = REST_ALT[src] && Math.random() > 0.6;
        img.src = (useAlt ? REST_ALT[src] : (BASE_IMG[src] || src)) + IMG_V;
        img.className = 'singer-video dancing';
        img.style.setProperty('--beat', beatDur + 's');
      }
    }, halfBeatMs);

    singIntervals.push(intervalId);
    wrap.classList.add('singing-active');
  });
}

/* ════════════════════════════════════════════════════════════════
   LEVEL COMPLETE
════════════════════════════════════════════════════════════════ */

function levelComplete() {
  const nextId = currentLevel + 1;
  if (nextId <= 8 && !unlocked.includes(nextId)) unlocked.push(nextId);
  if (!completed.includes(currentLevel)) completed.push(currentLevel);
  saveState();
  earnPrize(currentLevel);

  spawnConfetti();
  buildCrowd();
  startStageSparkles();

  // Singing characters — AI-generated video animation
  const cStage = document.getElementById('celebrate-stage');
  cStage.innerHTML = '';

  const chars = charsForLevel(currentLevel);

  // Scale characters based on count so they all fit on screen
  const charSizes = { 1: ['52vh','44vw'], 2: ['48vh','30vw'], 3: ['42vh','26vw'] };
  const [maxH, maxW] = charSizes[Math.min(chars.length, 3)] || charSizes[3];
  cStage.style.setProperty('--char-max-h', maxH);
  cStage.style.setProperty('--char-max-w', maxW);
  const track = YT_TRACKS[currentLevel - 1];
  const lyricsDelay = track ? (track.lyricsStart || 0) : 0;

  // Calculate dance speed from BPM (one full bounce per beat)
  const bpm = track ? (track.bpm || 120) : 120;
  const beatDuration = (60 / bpm).toFixed(3);  // seconds per beat

  // Set BPM var on both the arena and the screen so all animations sync
  const stageWrap = document.getElementById('concert-stage-wrap');
  if (stageWrap) stageWrap.style.setProperty('--stage-beat', beatDuration + 's');
  const screenEl = document.getElementById('screen-celebrate');
  if (screenEl) screenEl.style.setProperty('--stage-beat', beatDuration + 's');

  // Build LED strip dots
  const ledStrip = document.getElementById('led-strip');
  if (ledStrip) {
    ledStrip.innerHTML = '';
    const ledColors = ['#ff6fbf','#4dd9f5','#a259ff','#ffd966','#39ff8f','#ff6fbf','#4dd9f5','#a259ff','#ffd966','#ff6fbf','#4dd9f5','#a259ff','#ffd966','#39ff8f','#ff6fbf','#4dd9f5','#a259ff','#ffd966','#ff6fbf','#4dd9f5','#a259ff','#ffd966','#39ff8f','#ff6fbf','#4dd9f5','#a259ff','#ffd966','#ff6fbf','#4dd9f5','#a259ff'];
    ledColors.forEach((c, i) => {
      const dot = document.createElement('div');
      dot.className = 'led-dot';
      dot.style.setProperty('--c', c);
      dot.style.setProperty('--d', (parseFloat(beatDuration) * (0.4 + (i % 5) * 0.12)).toFixed(3) + 's');
      dot.style.setProperty('--delay', (i * 0.04).toFixed(3) + 's');
      ledStrip.appendChild(dot);
    });
  }

  chars.forEach((src, charIdx) => {
    const wrap = document.createElement('div');
    wrap.className = 'singer-wrap';
    wrap.style.setProperty('--beat', beatDuration + 's');

    // Spotlight glow behind the character
    const spotlight = document.createElement('div');
    spotlight.className = 'char-spotlight';
    wrap.appendChild(spotlight);

    // Try to use dancing video if available, fallback to static image
    const videoSrc = SING_VIDEOS[src];
    if (videoSrc) {
      const vid = document.createElement('video');
      vid.src = videoSrc;
      vid.className = 'singer-video singer-video-clip dancing';
      vid.id = 'singer-static-' + charIdx;
      vid.loop = true;
      vid.muted = true;        // muted so it doesn't conflict with music
      vid.playsInline = true;
      vid.autoplay = true;
      vid.style.setProperty('--beat', beatDuration + 's');
      vid.onerror = () => {
        // Video not found — fallback to image
        const img = document.createElement('img');
        img.src = (BASE_IMG[src] || src) + IMG_V;
        img.className = 'singer-video dancing';
        img.id = 'singer-static-' + charIdx;
        img.style.setProperty('--beat', beatDuration + 's');
        vid.replaceWith(img);
      };
      wrap.appendChild(vid);
      // Mark as video-powered so startSingPhrase skips frame-swapping
      wrap.dataset.hasVideo = 'true';
    } else {
      const img = document.createElement('img');
      img.src = (BASE_IMG[src] || src) + IMG_V;
      img.className = 'singer-video dancing';
      img.id = 'singer-static-' + charIdx;
      img.style.setProperty('--beat', beatDuration + 's');
      wrap.appendChild(img);
    }

    // Glow floor
    const glow = document.createElement('div');
    glow.className = 'glow-floor';
    wrap.appendChild(glow);

    cStage.appendChild(wrap);
  });

  // Store chars so the YT state change callback can trigger singing
  pendingChars = { chars, lyricsDelay };

  document.getElementById('celebrate-title').textContent =
    `כל הכבוד! סיימת שלב ${currentLevel}! 🎉`;

  // Audio playback — use local MP3 files for instant, reliable playback
  const ytWrap = document.getElementById('yt-wrap');
  isMuted = false;
  document.getElementById('mute-btn').textContent = '🔇 השתק';
  if (track) {
    document.getElementById('yt-song-name').textContent = track.name;
    document.getElementById('yt-link').href =
      `https://www.youtube.com/watch?v=${track.id}&t=${track.start}s`;

    // Use local MP3 for instant playback
    if (localAudio) { localAudio.pause(); localAudio = null; }
    if (track.mp3) {
      localAudio = new Audio(track.mp3);
      localAudio.volume = 1;
      localAudio.play().then(() => {
        // Audio started — begin singing after lyrics delay
        startSingingAfterDelay(chars, track.lyricsStart || 0);
        pendingChars = null;
      }).catch(() => {
        // Autoplay blocked — start singing anyway, user can unmute
        startSingingAfterDelay(chars, 0);
        pendingChars = null;
      });
    } else {
      // Fallback to YouTube
      if (ytPlayer) { ytPlayer.destroy(); ytPlayer = null; }
      ytPlayer = new YT.Player('yt-iframe', {
        width: '300', height: '50',
        videoId: track.id,
        playerVars: { autoplay: 1, start: track.start, enablejsapi: 1 },
        events: { onStateChange: onYTStateChange }
      });
    }

    ytWrap.style.display = '';
    document.getElementById('yt-player-wrap').style.display = 'none';
  } else {
    ytWrap.style.display = 'none';
    if (ytPlayer) { ytPlayer.destroy(); ytPlayer = null; }
    if (localAudio) { localAudio.pause(); localAudio = null; }
    document.getElementById('yt-player-wrap').style.display = 'none';
    // No music — start singing immediately
    startSingingAfterDelay(chars, 0);
    pendingChars = null;
  }

  // Start floating music notes around dancing character
  startMusicNotes();

  // Prize gift button — reset, then show after 2.5s
  const giftBtn = document.getElementById('prize-gift-btn');
  if (giftBtn) giftBtn.style.display = 'none';
  if (!isPrizeRevealed(currentLevel)) {
    setTimeout(() => {
      const b = document.getElementById('prize-gift-btn');
      if (b) b.style.display = 'block';
    }, 2500);
  }

  // Next button — leads through prize reveal if not yet seen
  const nextBtn = document.getElementById('next-btn');
  if (!isPrizeRevealed(currentLevel)) {
    nextBtn.textContent = currentLevel < 8 ? '🎁 קבל/י את הפרס! →' : '🏆 קבל/י את הפרס הגדול!';
  } else {
    nextBtn.textContent = currentLevel < 8 ? '🚀 שלב הבא!' : '🏠 חזרה הביתה';
  }

  // Next prize teaser (appears after gift button)
  const teaserEl = document.getElementById('next-prize-teaser');
  if (teaserEl) teaserEl.style.display = 'none';
  setTimeout(renderNextPrizeTeaser, 3200);

  showScreen('screen-celebrate');
}

function nextLevel() {
  // If prize not yet revealed, show it first — prizeGoNext() will navigate onward
  if (isPrizeEarned(currentLevel) && !isPrizeRevealed(currentLevel)) {
    showPrizeReveal(currentLevel, false);
    return;
  }
  stopMusic();
  currentLevel < 8 ? startLevel(currentLevel + 1) : goHome();
}

function goHome() {
  stopMusic();
  renderLevelSelect();
}

function stopMusic() {
  hidePrizeReveal();
  if (localAudio) {
    localAudio.pause();
    localAudio.currentTime = 0;
    localAudio = null;
  }
  if (ytPlayer) {
    try { ytPlayer.destroy(); } catch(e) {}
    ytPlayer = null;
    // Recreate the placeholder div for next use
    const wrap = document.getElementById('yt-player-wrap');
    if (wrap && !document.getElementById('yt-iframe')) {
      const div = document.createElement('div');
      div.id = 'yt-iframe';
      wrap.appendChild(div);
    }
  }
  pendingChars = null;
  if (notesInterval) { clearInterval(notesInterval); notesInterval = null; }
  if (singTimeout) { clearTimeout(singTimeout); singTimeout = null; }
  singIntervals.forEach(id => clearTimeout(id));
  singIntervals = [];
  const notesEl = document.querySelector('.music-notes');
  if (notesEl) notesEl.remove();
  // Remove singing state
  document.querySelectorAll('.singer-wrap').forEach(w => w.classList.remove('singing-active'));
  // Stop sparkles
  stopStageSparkles();
}

function toggleMute() {
  isMuted = !isMuted;
  if (localAudio) {
    localAudio.muted = isMuted;
  }
  if (ytPlayer) {
    try {
      if (isMuted) { ytPlayer.mute(); } else { ytPlayer.unMute(); }
    } catch(e) {}
  }
  document.getElementById('mute-btn').textContent = isMuted ? '🔊 הפעל' : '🔇 השתק';
}

function startMusicNotes() {
  // Remove old notes container
  const old = document.querySelector('.music-notes');
  if (old) old.remove();
  if (notesInterval) clearInterval(notesInterval);

  const stage = document.getElementById('celebrate-stage');
  const container = document.createElement('div');
  container.className = 'music-notes';
  stage.parentElement.appendChild(container);

  const NOTES = ['🎵','🎶','♪','♫','🎤','💜','✨','⭐'];
  notesInterval = setInterval(() => {
    const note = document.createElement('span');
    note.className = 'music-note';
    note.textContent = NOTES[Math.floor(Math.random() * NOTES.length)];
    const x = 15 + Math.random() * 70;
    note.style.cssText = `
      left: ${x}%;
      bottom: 20%;
      --t: ${(1.5 + Math.random() * 1.5).toFixed(1)}s;
      --d: 0s;
      --dx: ${(-30 + Math.random() * 60).toFixed(0)}px;
      --dx2: ${(-50 + Math.random() * 100).toFixed(0)}px;
      font-size: ${(1 + Math.random() * 0.8).toFixed(1)}rem;
    `;
    container.appendChild(note);
    setTimeout(() => note.remove(), 3500);
  }, 400);
}

/* ════════════════════════════════════════════════════════════════
   VISUAL EFFECTS
════════════════════════════════════════════════════════════════ */

function flashScreen(color) {
  const el = document.getElementById('flash');
  el.className = color;
  setTimeout(() => { el.className = ''; }, color === 'green' ? 700 : 1200);
}

const SPARKLE_EMOJIS = ['⭐','✨','💫','🌟','💥'];

function spawnSparkles(btn) {
  const overlay = document.getElementById('sparkle-overlay');
  const rect    = btn.getBoundingClientRect();
  for (let i = 0; i < 7; i++) {
    const span = document.createElement('span');
    span.className   = 'sparkle';
    span.textContent = SPARKLE_EMOJIS[Math.floor(Math.random() * SPARKLE_EMOJIS.length)];
    span.style.left  = (rect.left + Math.random() * rect.width)  + 'px';
    span.style.top   = (rect.top  + Math.random() * rect.height) + 'px';
    span.style.animationDelay = (Math.random() * .15) + 's';
    overlay.appendChild(span);
    setTimeout(() => span.remove(), 900);
  }
}

const CONFETTI_EMOJIS = ['⭐','🎵','💖','🎊','✨','💫','🌟','🎤','💎','🚀'];

function spawnConfetti() {
  const overlay = document.getElementById('sparkle-overlay');
  for (let i = 0; i < 36; i++) {
    const span = document.createElement('span');
    span.className   = 'confetti-piece';
    span.textContent = CONFETTI_EMOJIS[Math.floor(Math.random() * CONFETTI_EMOJIS.length)];
    const dur = (Math.random() * 2.2 + 1.5).toFixed(1);
    span.style.cssText = `
      left: ${Math.random() * 100}vw;
      --dur2: ${dur}s;
      animation-delay: ${(Math.random() * 0.9).toFixed(2)}s;
      font-size: ${(Math.random() * 1.2 + 0.8).toFixed(1)}rem;
    `;
    overlay.appendChild(span);
    setTimeout(() => span.remove(), (parseFloat(dur) + 1.2) * 1000);
  }
}

/* ════════════════════════════════════════════════════════════════
   SPARKLE PARTICLE SYSTEM — continuous stage sparkles
════════════════════════════════════════════════════════════════ */
let sparkleInterval = null;
const SPARKLE_COLORS = ['#ff6fbf','#4dd9f5','#a259ff','#ffd966','#39ff8f','#fff','#ff3fa0','#7b2fff'];
const STAGE_SPARKLE_EMOJIS = ['✨','💜','⭐','💫','🌟','💖','🎵','🎶','♪','💎'];

function startStageSparkles() {
  if (sparkleInterval) return;
  const container = document.getElementById('stage-particles');
  if (!container) return;

  sparkleInterval = setInterval(() => {
    // Spawn 2-4 particles per tick
    const count = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const isEmoji = Math.random() > 0.65;
      const p = document.createElement('span');
      p.className = 'sparkle-particle ' + (isEmoji ? 'emoji' : 'dot');

      if (isEmoji) {
        p.textContent = STAGE_SPARKLE_EMOJIS[Math.floor(Math.random() * STAGE_SPARKLE_EMOJIS.length)];
        p.style.setProperty('--sp-size', (0.8 + Math.random() * 1.2).toFixed(1) + 'rem');
      } else {
        const color = SPARKLE_COLORS[Math.floor(Math.random() * SPARKLE_COLORS.length)];
        p.style.setProperty('--sp-color', color);
        p.style.setProperty('--sp-size', (2 + Math.random() * 5).toFixed(0) + 'px');
      }

      const dur = (2 + Math.random() * 3).toFixed(1);
      p.style.left = (5 + Math.random() * 90) + '%';
      p.style.bottom = (5 + Math.random() * 30) + '%';
      p.style.setProperty('--sp-dur', dur + 's');
      p.style.setProperty('--sp-delay', (Math.random() * 0.5).toFixed(2) + 's');
      p.style.setProperty('--sp-dy', (-120 - Math.random() * 200).toFixed(0) + 'px');
      p.style.setProperty('--sp-dx', (-60 + Math.random() * 120).toFixed(0) + 'px');
      p.style.setProperty('--sp-rot', (Math.random() * 360).toFixed(0) + 'deg');

      container.appendChild(p);
      setTimeout(() => p.remove(), (parseFloat(dur) + 1) * 1000);
    }
  }, 200);
}

function stopStageSparkles() {
  if (sparkleInterval) { clearInterval(sparkleInterval); sparkleInterval = null; }
  const container = document.getElementById('stage-particles');
  if (container) container.innerHTML = '';
}

/* ════════════════════════════════════════════════════════════════
   CROWD SILHOUETTE — waving lightsticks audience
════════════════════════════════════════════════════════════════ */
function buildCrowd() {
  const crowd = document.getElementById('crowd-silhouette');
  if (!crowd) return;
  crowd.innerHTML = '';
  const lsColors = ['#ff6fbf','#4dd9f5','#a259ff','#ffd966','#39ff8f','#ff3fa0','#7b2fff'];
  const count = Math.floor(window.innerWidth / 20);

  for (let i = 0; i < count; i++) {
    const person = document.createElement('div');
    person.className = 'crowd-person';
    person.style.setProperty('--ch', (28 + Math.random() * 30).toFixed(0) + 'px');

    // ~60% of crowd holds a lightstick
    if (Math.random() > 0.4) {
      const stick = document.createElement('div');
      stick.className = 'lightstick';
      const color = lsColors[Math.floor(Math.random() * lsColors.length)];
      stick.style.setProperty('--ls-color', color);
      stick.style.setProperty('--ls-speed', (0.5 + Math.random() * 0.8).toFixed(2) + 's');
      stick.style.setProperty('--ls-delay', (Math.random() * 1).toFixed(2) + 's');
      person.appendChild(stick);
    }

    crowd.appendChild(person);
  }
}

/* ════════════════════════════════════════════════════════════════
   PRIZE ECONOMY
════════════════════════════════════════════════════════════════ */

const PRIZE_MANIFEST = [
  { level:1, type:'bracelet',  tier:'fan',     char:'zoey', emoji:'💜', name:'צמיד החברות של זואי',      cardNum:null,      revealMsg:n=>`ברוך/ה הבא/ה לצוות, ${n}! זואי הכינה אותו במיוחד בשבילך 💜`,                    secret:null },
  { level:2, type:'photocard', tier:'fan',     char:'mira', emoji:'🃏', name:'פוטו קארד מירה #001',       cardNum:'001/008', revealMsg:n=>`מירה מסתכלת עליך, ${n}. היא מרשימה, נכון? 🔴`,                             secret:null },
  { level:3, type:'sticker',   tier:'star',    char:'rumi', emoji:'✨', name:'מדבקה הולוגרפית של רומי',   cardNum:null,      revealMsg:n=>`רומי שלחה לך משהו מיוחד, ${n}... היא לא עושה את זה לכולם 💙`,              secret:null },
  { level:4, type:'message',   tier:'star',    char:'zoey', emoji:'💌', name:'הודעה סודית מזואי',         cardNum:null,      revealMsg:n=>`זואי שמרה עליך סוד, ${n}... קרא/י מה היא כתבה!`,                           secret:n=>`היי ${n}! 💜\nחיסור זה קצת מפחיד בהתחלה,\nאבל את/ה חזק/ה! אני מאמינה בך!\n— זואי\nP.S. אל תגיד/י למירה שכתבתי לך קודם 🤫` },
  { level:5, type:'outfit',    tier:'diamond', char:'mira', emoji:'👗', name:'תלבושת הבמה של מירה',       cardNum:null,      revealMsg:n=>`מירה יש תלבושת שמעולם לא הראתה לאף אחד... עד עכשיו. רק בשבילך, ${n} ✨`,  secret:null },
  { level:6, type:'poster',    tier:'diamond', char:'all',  emoji:'🖼️', name:'מיני פוסטר: אחרי הקונצרט', cardNum:null,      revealMsg:n=>`הן לא מראות לכולם מה קורה מאחורי הקלעים... אבל בשבילך, ${n} 🎭`,         secret:null },
  { level:7, type:'photocard', tier:'diamond', char:'rumi', emoji:'💎', name:'פוטו קארד רומי #008',        cardNum:'008/008', revealMsg:n=>`008 מתוך 008. הכרטיס הזה לא אמור להתקיים... אבל הוא שלך, ${n} 💙`,      secret:null },
  { level:8, type:'fanclub',   tier:'legend',  char:'all',  emoji:'👑', name:'כרטיס מועדון האוהדים',      cardNum:null,      revealMsg:n=>`${n} — את/ה לא רק פאן. את/ה חבר/ה. לנצח 🌟`,                                  secret:null },
];
const TIER_CONFIG = {
  fan:     { he:'פאן' },
  star:    { he:'כוכב' },
  diamond: { he:'יהלום' },
  legend:  { he:'אגדה' },
};

let gameData = { playerName: '', prizes: {}, lastPlayed: 0 };
let prizeRevealLevel   = 0;
let prizeRevealReturn  = false; // if true, prizeGoNext returns to fan room

function loadGameData() {
  const s = localStorage.getItem('kpop_game_data');
  if (s) try { gameData = Object.assign(gameData, JSON.parse(s)); } catch(e) {}
}
function saveGameData() {
  gameData.lastPlayed = Date.now();
  localStorage.setItem('kpop_game_data', JSON.stringify(gameData));
}
function getPlayerName() { return gameData.playerName || 'חברה'; }
function earnPrize(level) {
  if (!gameData.prizes[level]) { gameData.prizes[level] = { earned:true, revealed:false }; saveGameData(); }
}
function isPrizeEarned(level)    { return !!(gameData.prizes[level] && gameData.prizes[level].earned); }
function isPrizeRevealed(level)  { return !!(gameData.prizes[level] && gameData.prizes[level].revealed); }
function markPrizeRevealed(level){ if (gameData.prizes[level]) { gameData.prizes[level].revealed = true; saveGameData(); } }
function countEarnedPrizes()     { return Object.values(gameData.prizes).filter(p => p.earned).length; }
function hasUnrevealedPrize()    { return PRIZE_MANIFEST.some(p => isPrizeEarned(p.level) && !isPrizeRevealed(p.level)); }

/* ── Name Entry ───────────────────────────────────────────────── */
function initGame() {
  loadGameData();
  if (!gameData.playerName) {
    showScreen('screen-name');
    const ni = document.getElementById('name-input');
    if (ni) ni.addEventListener('keydown', e => { if (e.key === 'Enter') submitName(); });
  } else {
    renderLevelSelect();
  }
}
function submitName() {
  const input = document.getElementById('name-input');
  const name  = input ? input.value.trim() : '';
  if (name) { gameData.playerName = name; saveGameData(); }
  renderLevelSelect();
}

/* ── Fan Room button update ───────────────────────────────────── */
function updateFanRoomButton() {
  const btn = document.getElementById('fanroom-btn');
  const dot = document.getElementById('fanroom-notif-dot');
  if (!btn) return;
  const earned = countEarnedPrizes();
  btn.style.display = earned > 0 ? '' : 'none';
  if (dot) dot.style.display = hasUnrevealedPrize() ? '' : 'none';
}

/* ── Prize Reveal ─────────────────────────────────────────────── */
function showPrizeReveal(level, returnToFanRoom) {
  prizeRevealLevel  = level;
  prizeRevealReturn = !!returnToFanRoom;
  const prize = PRIZE_MANIFEST.find(p => p.level === level);
  if (!prize) return;
  const name = getPlayerName();

  // Tier badge
  const badge = document.getElementById('prize-reveal-tier-badge');
  badge.textContent = TIER_CONFIG[prize.tier].he;
  badge.className   = 'prize-reveal-tier-badge tier-' + prize.tier;

  // Prize card
  const charImgKey = prize.char === 'all' ? 'zoey.png' : (prize.char + '.png');
  const charImg = BASE_IMG[charImgKey] || charImgKey;
  document.getElementById('prize-card-container').innerHTML = `
    <div class="prize-card tier-${prize.tier}">
      <img class="prize-card-char-img" src="${charImg}" alt="${prize.char}" onerror="this.style.display='none'">
      <div class="prize-card-bg-emoji">${prize.emoji}</div>
      <div class="prize-card-bottom">
        <div class="prize-card-name">${prize.name}</div>
        ${prize.cardNum ? `<div class="prize-card-num">#${prize.cardNum}</div>` : ''}
      </div>
    </div>`;

  document.getElementById('prize-reveal-prize-name').textContent = prize.name;
  document.getElementById('prize-reveal-msg-text').textContent   = prize.revealMsg(name);

  // Secret note (level 4)
  const sw = document.getElementById('prize-reveal-secret-wrap');
  sw.innerHTML = prize.secret ? `<div class="prize-secret-note">${prize.secret(name)}</div>` : '';

  // Next button label
  const nb = document.getElementById('prize-next-btn');
  if (returnToFanRoom)       nb.textContent = '← חזרה לאוסף';
  else if (level < 8)        nb.textContent = '🚀 לשלב הבא!';
  else                       nb.textContent = '🏠 חזרה הביתה';

  // Show overlay
  document.getElementById('prize-reveal-overlay').classList.add('active');
  markPrizeRevealed(level);

  if (prize.tier === 'legend') { spawnConfetti(); setTimeout(spawnConfetti, 600); }
}

function hidePrizeReveal() {
  document.getElementById('prize-reveal-overlay').classList.remove('active');
}

function prizeGoNext() {
  hidePrizeReveal();
  if (prizeRevealReturn) { renderFanRoom(); return; }
  stopMusic();
  prizeRevealLevel < 8 ? startLevel(prizeRevealLevel + 1) : goHome();
}

function prizeShowFanRoom() {
  hidePrizeReveal();
  renderFanRoom();
}

function revealCurrentPrize() {
  document.getElementById('prize-gift-btn').style.display = 'none';
  showPrizeReveal(currentLevel, false);
}

/* ── Fan Room ─────────────────────────────────────────────────── */
function renderFanRoom() {
  const earned = countEarnedPrizes();
  document.getElementById('fanroom-count').textContent = `${earned} / 8 פרסים אספת ✨`;
  const grid = document.getElementById('fanroom-grid');
  grid.innerHTML = '';
  PRIZE_MANIFEST.forEach(prize => {
    const isEarned = isPrizeEarned(prize.level);
    const slot = document.createElement('div');
    slot.className = `fanroom-slot tier-${prize.tier} ${isEarned ? 'earned' : 'locked'}`;
    if (isEarned) {
      slot.onclick = () => showPrizeReveal(prize.level, true);
      slot.innerHTML = `
        <div class="fanroom-slot-emoji">${prize.emoji}</div>
        <div class="fanroom-slot-name">${prize.name}</div>
        <div class="fanroom-slot-tier">${TIER_CONFIG[prize.tier].he}</div>
        ${prize.cardNum ? `<div class="fanroom-slot-cardnum">#${prize.cardNum}</div>` : ''}`;
    } else {
      slot.innerHTML = `
        <div style="font-size:1.4rem">🔒</div>
        <div class="fanroom-slot-name" style="opacity:.4">שלב ${prize.level}</div>
        <div class="fanroom-slot-tier">${TIER_CONFIG[prize.tier].he}</div>`;
    }
    grid.appendChild(slot);
  });
  showScreen('screen-fanroom');
}

/* ── Next prize teaser ────────────────────────────────────────── */
function renderNextPrizeTeaser() {
  const teaser = document.getElementById('next-prize-teaser');
  if (!teaser) return;
  const nextLvl = currentLevel + 1;
  const nextPrize = PRIZE_MANIFEST.find(p => p.level === nextLvl);
  if (!nextPrize) { teaser.style.display = 'none'; return; }
  document.getElementById('teaser-emoji').textContent       = nextPrize.emoji;
  document.getElementById('teaser-prize-name').textContent  = nextPrize.name;
  document.getElementById('teaser-tier-label').textContent  = TIER_CONFIG[nextPrize.tier].he;
  teaser.style.display = 'flex';
}

/* ════════════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════════════ */

initGame();
</script>
